<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado Trunking & DTP - Operação e Negociação de EtherChannel Estático (Mode On)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado Trunking & DTP - Operação e Negociação de EtherChannel Estático (Mode On)</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre Trunking & DTP - Operação e Negociação de EtherChannel Estático (Mode On). Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Como o modo de agregação estático 'channel-group X mode on' opera em termos de troca de pacotes de controle entre os switches?",
    "options": [
      "Ele envia pacotes LACPDU a cada 1 segundos para verificar a estabilidade do enlace.",
      "Ele força a agregação sem utilizar nenhum protocolo de sinalização ou negociação de controle, assumindo passivamente que o vizinho está configurado da mesma forma.",
      "Ele troca quadros PAgP proprietários exclusivos da Cisco a cada 30 segundos.",
      "Ele exige autenticação prévia via CHAP antes de unir as interfaces."
    ],
    "answer": "Ele força a agregação sem utilizar nenhum protocolo de sinalização ou negociação de controle, assumindo passivamente que o vizinho está configurado da mesma forma.",
    "explanation": "No modo estático 'On', a agregação é forçada manualmente sem a troca de pacotes de controle ou negociação de link, o que exige alinhamento manual perfeito na outra ponta."
  },
  {
    "question": "O que ocorre na rede se um switch for configurado com 'channel-group 1 mode on' e o switch vizinho estiver com portas normais de acesso ou trunk sem EtherChannel ativado?",
    "options": [
      "O link cai imediatamente por falha de sincronismo e entra em estado de hibernação.",
      "Ocorrem loops severos de Camada 2 ou queda massiva de pacotes, pois o switch vizinho tratará os cabos como portas independentes e receberá tráfego duplicado.",
      "O Spanning Tree bloqueia todas as portas por padrão de segurança port-security.",
      "O switch converte automaticamente a outra ponta para o modo estático."
    ],
    "answer": "Ocorrem loops severos de Camada 2 ou queda massiva de pacotes, pois o switch vizinho tratará os cabos como portas independentes e receberá tráfego duplicado.",
    "explanation": "Como o modo estático não envia pacotes de sinalização para avisar o vizinho, se a outra ponta não estiver configurada corretamente, o tráfego gerará loops de Camada 2."
  },
  {
    "question": "Qual é a principal limitação ou risco operacional de utilizar o EtherChannel em modo estático (Mode On) em redes corporativas?",
    "options": [
      "Ele suporta no máximo 2 portas físicas no grupo.",
      "Ele não possui mecanismos de detecção de erros de configuração ou links unidirecionais, aumentando o risco de loops e falhas silenciosas.",
      "Ele consome o dobro de memória RAM na CPU do switch em comparação ao LACP.",
      "Ele é incompatível com troncos 802.1Q."
    ],
    "answer": "Ele não possui mecanismos de detecção de erros de configuração ou links unidirecionais, aumentando o risco de loops e falhas silenciosas.",
    "explanation": "A ausência de um protocolo de controle (como LACP ou PAgP) significa que o modo estático não valida a configuração da outra ponta dinamicamente."
  },
  {
    "question": "O que o comando 'channel-group 1 mode on' exige obrigatoriamente nas interfaces físicas do switch antes de consolidar o agrupamento?",
    "options": [
      "Que todas as portas estejam operando estritamente na mesma velocidade, duplex, modo de switchport e VLAN nativa.",
      "Que os cabos sejam de fibra óptica multimodo obrigatoriamente.",
      "Que o STP seja desativado em todo o domínio de broadcast.",
      "Que o roteamento estático esteja habilitado no núcleo."
    ],
    "answer": "Que todas as portas estejam operando estritamente na mesma velocidade, duplex, modo de switchport e VLAN nativa.",
    "explanation": "Como o modo estático não negocia parâmetros dinamicamente, as portas físicas membros devem possuir configuração idêntica de camada física e enlace para evitar inconsistências."
  },
  {
    "question": "Como o comando 'show etherchannel summary' exibe o estado de uma interface Port-Channel estática que está operando perfeitamente em Camada 2?",
    "options": [
      "Po1(RU) e protocolo 'Not Applicable' ou 'Static'",
      "Po1(SU) e protocolo LACP ou PAgP (ou sem protocolo de sinalização dependendo da versão do IOS)",
      "Po1(LD) com flag de erro",
      "Po1(RR) com Layer 3 ativo"
    ],
    "answer": "Po1(SU) e protocolo LACP ou PAgP (ou sem protocolo de sinalização dependendo da versão do IOS)",
    "explanation": "A flag 'S' indica Camada 2 (Layer 2) e 'U' indica Operacional (In use / Up)."
  },
  {
    "question": "Qual flag é exibida no comando 'show etherchannel summary' quando uma porta física membro é suspensa ou rejeitada do grupo devido a uma inconsistência de parâmetros?",
    "options": [
      "(P) - Bundled in port-channel",
      "(s) - Suspended ou (I) - Stand-alone",
      "(D) - Down físico",
      "(H) - Hot-standby"
    ],
    "answer": "(s) - Suspended ou (I) - Stand-alone",
    "explanation": "Portas com parâmetros desalinhados são colocadas em estado stand-alone (I) ou suspensas (s) para evitar corrupção de tráfego."
  },
  {
    "question": "O que acontece com o tráfego de dados de uma sessão TCP específica que cruza um EtherChannel estático configurado com múltiplos links físicos?",
    "options": [
      "Os pacotes individuais da sessão são divididos e alternados byte a byte em todos os cabos físicos simultaneamente.",
      "Todo o fluxo daquela sessão específica é direcionado por hash para apenas um único link físico do grupo.",
      "O switch duplica a sessão em todos os cabos para garantir redundância em tempo real.",
      "O tráfego é bloqueado até que o LACP valide a conexão."
    ],
    "answer": "Todo o fluxo daquela sessão específica é direcionado por hash para apenas um único link físico do grupo.",
    "explanation": "O balanceamento de carga do EtherChannel opera por fluxo (usando hash), mantendo todos os pacotes de uma mesma conexão no mesmo link físico para evitar entrega fora de ordem."
  },
  {
    "question": "Se um administrador configurar o balanceamento de carga com 'port-channel load-balance src-dst-ip', quais campos do pacote são avaliados pelo algoritmo de hash?",
    "options": [
      "Apenas os endereços MAC de origem e destino.",
      "A combinação matemática (XOR) dos endereços IP de origem e IP de destino.",
      "Apenas a porta TCP de origem.",
      "A prioridade PCP do cabeçalho 802.1Q."
    ],
    "answer": "A combinação matemática (XOR) dos endereços IP de origem e IP de destino.",
    "explanation": "O método 'src-dst-ip' utiliza os endereços IP de origem e destino do pacote para calcular o hash que define o link físico de saída."
  },
  {
    "question": "Qual comando global no Cisco IOS é utilizado para alterar o método de hash do balanceamento de carga em um switch com EtherChannels?",
    "options": [
      "port-channel load-balance <método>",
      "channel-group load-share <método>",
      "etherchannel hashing algorithm <método>",
      "switchport load-interval <método>"
    ],
    "answer": "port-channel load-balance <método>",
    "explanation": "O comando global 'port-channel load-balance' define o critério de distribuição de tráfego para todos os Port-Channels do switch."
  },
  {
    "question": "Por que o modo estático (Mode On) é considerado desfavorável em ambientes corporativos em comparação aos protocolos dinâmicos como LACP?",
    "options": [
      "Porque ele consome muita largura de banda com o envio excessivo de pacotes de controle.",
      "Porque ele não previne falhas de configuração humana e não protege contra loops em caso de conexões incorretas na outra ponta.",
      "Porque ele impede totalmente a passagem de trunks 802.1Q.",
      "Porque ele só funciona em portas FastEthernet legadas."
    ],
    "answer": "Porque ele não previne falhas de configuração humana e não protege contra loops em caso de conexões incorretas na outra ponta.",
    "explanation": "A ausência de mensagens de controle impede que o switch detecte se o vizinho configurou errado, tornando o modo estático propenso a loops se houver erro humano."
  }
      
      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

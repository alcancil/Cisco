<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado de Trunking & DTP - Anatomia do Encapsulamento 802.1Q, Tagging e Native VLAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado de Trunking & DTP - Anatomia do Encapsulamento 802.1Q, Tagging e Native VLAN</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre Simulado de Trunking & DTP - Anatomia do Encapsulamento 802.1Q, Tagging e Native VLAN. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Onde o cabeçalho 802.1Q de 4 bytes é inserido em um frame Ethernet II padrão?",
    "options": [
      "Logo após o campo Preamble & SFD, antes do Destination MAC.",
      "Entre o campo Source MAC Address e o campo Type/Length.",
      "Após o campo de dados (Payload), logo antes do Frame Check Sequence (FCS).",
      "Substituindo inteiramente o campo Destination MAC para otimizar o roteamento de Camada 2."
    ],
    "answer": "Entre o campo Source MAC Address e o campo Type/Length.",
    "explanation": "O padrão IEEE 802.1Q modifica o frame Ethernet inserindo um cabeçalho de 4 bytes exatamente entre o endereço MAC de origem (Source MAC) e o campo Type/Length."
  },
  {
    "question": "Qual é o valor hexadecimal padrão e obrigatório do campo TPID (Tag Protocol Identifier) em um cabeçalho 802.1Q válido?",
    "options": [
      "0x0800",
      "0x8100",
      "0x0806",
      "0xFFFF"
    ],
    "answer": "0x8100",
    "explanation": "O TPID é fixado no valor hexadecimal 0x8100. Ele avisa à placa de rede ou switch que o quadro possui uma tag 802.1Q; caso contrário, se não suportado, o quadro é descartado."
  },
  {
    "question": "Quantos bits compõem o campo VLAN ID (VID) dentro do TCI (Tag Control Information) e qual é o limite teórico de VLANs que ele permite endereçar?",
    "options": [
      "8 bits, permitindo até 256 VLANs.",
      "12 bits, permitindo até 4096 VLANs (de 0 a 4095).",
      "16 bits, permitindo até 65535 VLANs.",
      "10 bits, permitindo até 1024 VLANs."
    ],
    "answer": "12 bits, permitindo até 4096 VLANs (de 0 a 4095).",
    "explanation": "O VLAN ID possui 12 bits. Como 2 elevado a 12 resulta em 4096, o sistema suporta identificadores de VLAN na faixa de 0 a 4095."
  },
  {
    "question": "Quais faixas numéricas de VLAN são classificadas como faixa normal (Normal Range) e faixa estendida (Extended Range) em switches Cisco?",
    "options": [
      "Normal Range: 1 a 1005; Extended Range: 1006 a 4094.",
      "Normal Range: 1 a 500; Extended Range: 501 a 1024.",
      "Normal Range: 10 a 100; Extended Range: 101 a 5000.",
      "Normal Range: 1 a 4094; Extended Range: 4095 a 65535."
    ],
    "answer": "Normal Range: 1 a 1005; Extended Range: 1006 a 4094.",
    "explanation": "A faixa normal compreende as VLANs de 1 a 1001 (além de 1002 a 1005 reservadas para legado), enquanto a faixa estendida abrange os IDs de 1006 a 4094."
  },
  {
    "question": "Como os quadros pertencentes à VLAN Nativa (Native VLAN) trafegam por um link trunk configurado com o padrão IEEE 802.1Q?",
    "options": [
      "Eles trafegam obrigatoriamente etiquetados com a tag especial 0xFFF.",
      "Eles trafegam de forma sem tag (untagged).",
      "Eles são criptografados com uma chave temporária de Camada 2.",
      "Eles são convertidos em pacotes IP e roteados dinamicamente."
    ],
    "answer": "Eles trafegam de forma sem tag (untagged).",
    "explanation": "Por definição do padrão 802.1Q, os quadros que pertencem à Native VLAN do trunk cruzam o enlace sem nenhuma etiqueta[cite: 23]. Quando o switch receptor recebe um quadro sem tag no trunk, ele o associa à Native VLAN daquela porta."
  },
  {
    "question": "Qual é a VLAN configurada por padrão em switches Cisco para atuar tanto como VLAN padrão de acesso quanto como VLAN Nativa em portas trunk?",
    "options": [
      "VLAN 10",
      "VLAN 1",
      "VLAN 999",
      "VLAN 4094"
    ],
    "answer": "VLAN 1",
    "explanation": "Por padrão nos switches Cisco, a VLAN 1 atua como a VLAN Default e também como a VLAN Nativa de todas as portas configuradas como trunk."
  },
  {
    "question": "Qual é o principal risco de segurança associado a manter a VLAN Nativa configurada com o seu valor padrão (VLAN 1) em redes sem hardening?",
    "options": [
      "Exposição a ataques de negação de serviço em Camada 3 baseados em ICMP.",
      "Vulnerabilidade ao ataque de Double-Tagging (VLAN Hopping), permitindo que pacotes saltem para VLANs restritas.",
      "Sobrecarga imediata da CPU do switch devido à duplicação de pacotes STP.",
      "Corrupção da tabela CAM por estouro de cache MAC."
    ],
    "answer": "Vulnerabilidade ao ataque de Double-Tagging (VLAN Hopping), permitindo que pacotes saltem para VLANs restritas.",
    "explanation": "Se a VLAN nativa for a padrão (VLAN 1) e houver portas vulneráveis, um atacante pode injetar um quadro com duas tags (uma externa correspondente à nativa e uma interna da vítima) para burlar o roteamento e atingir outras VLANs."
  },
  {
    "question": "Qual comando de hardening no Cisco IOS é recomendado para mitigar ataques de VLAN Hopping forçando o etiquetamento de quadros da Native VLAN?",
    "options": [
      "switchport trunk native vlan tag",
      "switchport nonegotiate",
      "spanning-tree bpduguard enable",
      "switchport trunk allowed vlan remove 1"
    ],
    "answer": "switchport trunk native vlan tag",
    "explanation": "O comando global `switchport trunk native vlan tag` força o switch a etiquetar (tag) inclusive os quadros pertencentes à VLAN nativa ao enviá-los por um trunk, impedindo o ataque de Double-Tagging."
  },
  {
    "question": "O que ocorre se você emitir o comando `switchport trunk allowed vlan 30` em uma porta trunk que já estava configurada para permitir as VLANs 10 e 20?",
    "options": [
      "A VLAN 30 será adicionada de forma incremental à lista existente junto com a 10 e a 20.",
      "O comando será rejeitado pelo interpretador de comandos (CLI) por conflito de sintaxe.",
      "A lista anterior será totalmente sobrescrita, permitindo apenas a passagem da VLAN 30 e isolando as VLANs 10 e 20.",
      "O switch reiniciará a interface física para aplicar o pruning automático."
    ],
    "answer": "A lista anterior será totalmente sobrescrita, permitindo apenas a passagem da VLAN 30 e isolando as VLANs 10 e 20.",
    "explanation": "O comando `switchport trunk allowed vlan <vlan-list>` substitui a lista inteira. Para acrescentar uma VLAN sem apagar as anteriores, deve-se usar obrigatoriamente o parâmetro `add` (ex: `switchport trunk allowed vlan add 30`)."
  },
  {
    "question": "Qual subcampo do cabeçalho 802.1Q TCI (Tag Control Information) é dedicado ao suporte de Quality of Service (QoS) em Camada 2, permitindo até 8 níveis de prioridade?",
    "options": [
      "DEI (Drop Eligible Indicator)",
      "TPID (Tag Protocol Identifier)",
      "PCP ou Priority Code Point (3 bits)",
      "VLAN ID (12 bits)"
    ],
    "answer": "PCP ou Priority Code Point (3 bits)",
    "explanation": "O subcampo Priority / PCP possui 3 bits e é utilizado pelo IEEE 802.1p para classificar o tráfego em até 8 níveis de prioridade (0 a 7) voltados para QoS em Camada 2."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado de Fundamentos de EIGRP: Convergência, Queries, Reply e Estados Active/Passive</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado de Fundamentos de EIGRP: Convergência, Queries, Reply e Estados Active/Passive</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre Fundamentos de EIGRP: Convergência, Queries, Reply e Estados Active/Passive. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Qual é o papel dos pacotes Query (Opcode 3) e Reply (Opcode 4) no processo de convergência do EIGRP?",
    "options": [
      "O Query é enviado para buscar um caminho alternativo quando necessário durante a convergência, e o Reply é enviado em resposta a um pacote Query.",
      "O Query é usado apenas para descobrir vizinhos a cada 5 segundos e o Reply confirma pacotes Hello vazios.",
      "O Query anuncia rotas iniciais completas na formação de adjacência e o Reply altera o número do Autonomous System.",
      "O Query descarta rotas com hop count acima de 15 e o Reply instala rotas na interface Null0."
    ],
    "answer": "O Query é enviado para buscar um caminho alternativo quando necessário durante a convergência, e o Reply é enviado em resposta a um pacote Query.",
    "explanation": "Durante a convergência, o roteador utiliza pacotes Query para buscar um caminho alternativo e recebe pacotes Reply em resposta a esses Queries."
  },
  {
    "question": "Sob o transporte RTP (Reliable Transport Protocol), como são tratados os pacotes Query e Reply em termos de confiabilidade?",
    "options": [
      "Ambos são pacotes confiáveis, exigindo confirmação de recebimento por meio de ACK.",
      "Ambos são pacotes não confiáveis e não utilizam controle de sequência.",
      "Query é confiável e Reply é não confiável.",
      "Query é não confiável e Reply exige confirmação via broadcast."
    ],
    "answer": "Ambos são pacotes confiáveis, exigindo confirmação de recebimento por meio de ACK.",
    "explanation": "O RTP gerencia a entrega confiável com números de sequência e ACKs para pacotes Query e Reply, assim como para Update."
  },
  {
    "question": "O que acontece quando um roteador EIGRP detecta que um vizinho deixou de responder até o Hold Time chegar a zero?",
    "options": [
      "O roteador declara o vizinho inalcançável e notifica o algoritmo DUAL sobre a mudança de topologia.",
      "O roteador mantém o vizinho ativo na Neighbor Table e ignora a mudança de topologia até o próximo Hello.",
      "O roteador troca automaticamente o número do Autonomous System para manter a rota na RIB.",
      "O roteador converte todas as rotas EIGRP daquele vizinho em rotas estáticas na RIB."
    ],
    "answer": "O roteador declara o vizinho inalcançável e notifica o algoritmo DUAL sobre a mudança de topologia.",
    "explanation": "Se o Hold Time atinge zero sem recebimento de Hello, o vizinho é considerado inalcançável e o DUAL é notificado sobre a alteração na topologia."
  },
  {
    "question": "Como o algoritmo DUAL evita convergência lenta e loops de roteamento durante mudanças na topologia?",
    "options": [
      "Mantém rotas de backup pré-calculadas e livres de loops via Feasibility Condition (RD < FD) e coordena buscas por caminhos alternativos sem depender de mapas globais da rede.",
      "Envia a tabela de roteamento completa via broadcast a cada 30 segundos para todos os vizinhos.",
      "Exige que todos os roteadores do domínio executem o algoritmo Dijkstra SPF sobre uma LSDB comum.",
      "Desativa o cálculo de métricas e passa a encaminhar pacotes apenas por contagem de saltos."
    ],
    "answer": "Mantém rotas de backup pré-calculadas e livres de loops via Feasibility Condition (RD < FD) e coordena buscas por caminhos alternativos sem depender de mapas globais da rede.",
    "explanation": "O DUAL permite convergência rápida com rotas alternativas livres de loops e coordena a busca por caminhos sem necessidade de visão global da topologia ou temporizadores longos."
  },
  {
    "question": "Quando existe um Feasible Successor válido na Topology Table no momento em que o Successor atual falha, qual é o impacto direto na convergência?",
    "options": [
      "A rota alternativa já qualificada e livre de loops pode assumir o encaminhamento rapidamente sem depender de uma busca ampla por novos caminhos.",
      "O roteador é obrigado a aguardar 180 segundos de Hold Time antes de consultar a Topology Table.",
      "A rota é removida da RIB e o roteador passa a usar exclusivamente a rota padrão 0.0.0.0/0.",
      "O roteador exige a criação de uma rota estática apontando para Null0 para evitar loop."
    ],
    "answer": "A rota alternativa já qualificada e livre de loops pode assumir o encaminhamento rapidamente sem depender de uma busca ampla por novos caminhos.",
    "explanation": "Como o Feasible Successor já atende à Feasibility Condition (RD < FD), ele já é livre de loops e pode ser promovido de forma ágil quando o Successor falha."
  },
  {
    "question": "Em que momento um roteador EIGRP precisa recorrer ao envio de pacotes Query para buscar um caminho alternativo?",
    "options": [
      "Quando ocorre uma mudança de topologia/perda do caminho atual e não há um caminho alternativo qualificado disponível imediatamente sem consulta.",
      "A cada 5 segundos em interfaces rápidas para verificar se o vizinho ainda está ativo.",
      "Sempre que um novo roteador envia um pacote Hello vazio em unicast.",
      "Apenas quando o administrador altera a Administrative Distance de uma rota estática para 210."
    ],
    "answer": "Quando ocorre uma mudança de topologia/perda do caminho atual e não há um caminho alternativo qualificado disponível imediatamente sem consulta.",
    "explanation": "Os pacotes Query são enviados durante a convergência para buscar um caminho alternativo quando o roteador precisa localizar outra rota viável."
  },
  {
    "question": "Qual é o papel da Neighbor Table e da Topology Table durante uma convergência envolvendo perda de vizinho ou busca de rota?",
    "options": [
      "A Neighbor Table controla o estado e a disponibilidade dos vizinhos adjacentes, enquanto a Topology Table mantém os prefixos, métricas/atributos e rotas alternativas avaliadas pelo DUAL.",
      "A Neighbor Table armazena apenas rotas estáticas e a Topology Table guarda exclusivamente os endereços MAC multicast.",
      "A Neighbor Table substitui a RIB no encaminhamento de pacotes e a Topology Table armazena apenas o Hello Timer.",
      "Ambas as tabelas são apagadas a cada atualização incremental para economizar memória."
    ],
    "answer": "A Neighbor Table controla o estado e a disponibilidade dos vizinhos adjacentes, enquanto a Topology Table mantém os prefixos, métricas/atributos e rotas alternativas avaliadas pelo DUAL.",
    "explanation": "O EIGRP separa o controle de vizinhos na Neighbor Table e o armazenamento de prefixos, métricas e caminhos alternativos na Topology Table, apoiando o DUAL e a atualização da RIB."
  },
  {
    "question": "Por que o EIGRP envia apenas atualizações parciais e incrementais após a troca inicial de rotas durante a formação de adjacência?",
    "options": [
      "Para propagar apenas as mudanças de topologia de forma direcionada, evitando o envio periódico da tabela inteira via broadcast.",
      "Porque o EIGRP não consegue transmitir mais de um prefixo por pacote Update.",
      "Porque pacotes Update são enviados apenas uma vez a cada 180 segundos.",
      "Porque rotas alteradas só podem ser divulgadas após a expiração do Hold Time."
    ],
    "answer": "Para propagar apenas as mudanças de topologia de forma direcionada, evitando o envio periódico da tabela inteira via broadcast.",
    "explanation": "Na adjacência, os vizinhos trocam a tabela completa e, em seguida, enviam apenas atualizações parciais e incrementais quando ocorrem alterações na topologia."
  },
  {
    "question": "Qual é a diferença de função entre os pacotes Update (Opcode 1) e Query (Opcode 3) durante a operação do EIGRP?",
    "options": [
      "Update anuncia informações de roteamento e alcançabilidade (inicial ou incremental), enquanto Query consulta vizinhos durante a convergência em busca de um caminho alternativo.",
      "Update é enviado apenas em unicast para confirmar pacotes e Query é enviado a cada 60 segundos em enlaces lentos.",
      "Update solicita informações específicas de um vizinho e Query responde confirmando a recepção.",
      "Update é não confiável e Query é usado apenas em redes IPv6."
    ],
    "answer": "Update anuncia informações de roteamento e alcançabilidade (inicial ou incremental), enquanto Query consulta vizinhos durante a convergência em busca de um caminho alternativo.",
    "explanation": "O Update propaga rotas e alcançabilidade (tabela completa na formação da adjacência e incrementais depois), enquanto o Query busca um caminho alternativo durante a convergência."
  },
  {
    "question": "O que acontece com o Hold Time de um vizinho quando o roteador continua recebendo pacotes Hello normalmente durante a operação?",
    "options": [
      "O Hold Time é reiniciado a cada Hello recebido, mantendo o vizinho como alcançável e operacional.",
      "O Hold Time diminui progressivamente até zerar e força a desconexão preventiva do vizinho.",
      "O Hello Timer passa a ser igual ao Hold Time multiplicado por 3.",
      "O roteador envia um pacote Reply para cada Hello recebido."
    ],
    "answer": "O Hold Time é reiniciado a cada Hello recebido, mantendo o vizinho como alcançável e operacional.",
    "explanation": "Ao receber um pacote Hello, o temporizador de Hold Time é reiniciado, indicando que o vizinho continua ativo e alcançável."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

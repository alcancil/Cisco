<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado MSTP - Interoperabilidade e Simulação PVST+: O Papel do Boundary Port e SSTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado MSTP - Interoperabilidade e Simulação PVST+: O Papel do Boundary Port e SSTP</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre MSTP - Interoperabilidade e Simulação PVST+: O Papel do Boundary Port e SSTP. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Qual é a principal função do mecanismo de PVST Simulation Engine em switches operando com MSTP?",
    "options": [
      "Permitir que a região MSTP interopere e compreenda domínios legados que rodam PVST+ ou Rapid-PVST+ sem causar loops na rede.",
      "Acelerar o roteamento de pacotes IP em redes de Camada 3.",
      "Converter todos os BPDUs de 802.1Q em pacotes CDP proprietários da Cisco.",
      "Eliminar a necessidade de configurar o Configuration Name e o Revision Number nos switches de borda."
    ],
    "answer": "Permitir que a região MSTP interopere e compreenda domínios legados que rodam PVST+ ou Rapid-PVST+ sem causar loops na rede.",
    "explanation": "O motor de simulação de PVST atua na borda permitindo que o switch MSTP interaja com redes legadas Cisco PVST+, traduzindo e avaliando a compatibilidade topológica para evitar loops ocultos."
  },
  {
    "question": "Como um switch operando em MSTP se comunica com um switch legado PVST+ em relação à VLAN 1 (CST)?",
    "options": [
      "Enviando e recebendo BPDUs sem tag (untagged) em formato IEEE padrão 802.1Q no endereço multicast padrão do STP.",
      "Encapsulando os BPDUs dentro de pacotes UDP na porta 67.",
      "Bloqueando totalmente o tráfego da VLAN 1 para forçar o uso da VLAN 10.",
      "Utilizando exclusivamente o protocolo Spanning Tree clássico de 1998."
    ],
    "answer": "Enviando e recebendo BPDUs sem tag (untagged) em formato IEEE padrão 802.1Q no endereço multicast padrão do STP.",
    "explanation": "A VLAN 1 opera como a base do Common Spanning Tree (CST/CIST), utilizando BPDUs sem tag enviados para o endereço multicast padrão IEEE para conectar a região ao mundo externo."
  },
  {
    "question": "De que maneira o switch MSTP trata as VLANs ativas que são diferentes da VLAN 1 ao interagir com uma nuvem PVST+ legada?",
    "options": [
      "Ele descarta todas as VLANs que não sejam a VLAN nativa.",
      "Ele gera BPDUs em formato PVST+ (SSTP - Shared Spanning Tree Protocol) com tags para cada VLAN, replicando as decisões do CIST.",
      "Ele converte automaticamente o switch legado para o padrão 802.1s.",
      "Ele cria uma MSTI isolada para cada VLAN individual de forma dinâmica."
    ],
    "answer": "Ele gera BPDUs em formato PVST+ (SSTP - Shared Spanning Tree Protocol) com tags para cada VLAN, replicando as decisões do CIST.",
    "explanation": "Para as VLANs não-nativas, o MSTP emite BPDUs proprietários do tipo SSTP (tagged por VLAN) contendo exatamente as mesmas informações estruturais calculadas pelo CIST regional."
  },
  {
    "question": "O que caracteriza o estado de uma porta de borda MSTP quando ocorre uma inconsistência de simulação de PVST?",
    "options": [
      "A porta vai para o estado de erro 'err-disable'.",
      "A porta é bloqueada com o status 'PVST Simulation Inconsistent' (*pvt-incons).",
      "A porta é promovida automaticamente para Root Port principal.",
      "A porta desativa o Rapid-PVST+ e ativa o STP clássico de 30 segundos."
    ],
    "answer": "A porta é bloqueada com o status 'PVST Simulation Inconsistent' (*pvt-incons).",
    "explanation": "Quando o motor de simulação detecta uma divergência topológica ou tentativa de imposição de raiz incompatível pelo domínio PVST+, ele bloqueia a porta e sinaliza o erro *pvt-incons."
  },
  {
    "question": "Qual cenário típico aciona a mensagem de erro de inconsistência de PVST (`*pvt-incons`) em uma porta Boundary de um switch MSTP?",
    "options": [
      "Um switch PVST+ externo é configurado com uma prioridade superior (menor Bridge ID) e tenta se eleger como raiz para uma VLAN específica de forma isolada.",
      "O cabo de rede de fibra óptica sofre uma atenuação de sinal física.",
      "O número de revisão da região MSTP está configurado com o valor zero.",
      "A VLAN nativa do tronco foi alterada para a VLAN 99."
    ],
    "answer": "Um switch PVST+ externo é configurado com uma prioridade superior (menor Bridge ID) e tenta se eleger como raiz para uma VLAN específica de forma isolada.",
    "explanation": "Se o switch legado assume uma raiz diferente para uma VLAN na borda, o MSTP detecta uma topologia fragmentada e inconsistente, bloqueando a interface para impedir loops."
  },
  {
    "question": "O que é um Boundary Port no contexto da arquitetura do MSTP?",
    "options": [
      "Uma porta interna que conecta dois switches da mesma Região MST.",
      "Uma interface localizada na borda da Região MST que se conecta a um switch de outra região ou a um domínio legado (STP/RSTP/PVST+).",
      "Uma porta de acesso dedicada exclusivamente a impressoras de rede.",
      "Um link físico que opera unicamente com o protocolo OSPF de Camada 3."
    ],
    "answer": "Uma interface localizada na borda da Região MST que se conecta a um switch de outra região ou a um domínio legado (STP/RSTP/PVST+).",
    "explanation": "As Boundary Ports delimitam a fronteira da região MST, atuando como o ponto de tradução e compatibilidade com redes externas e switches legados."
  },
  {
    "question": "Como o Migration Delay Timer atua quando uma interface de um switch MSTP sobe e precisa interagir com um dispositivo vizinho?",
    "options": [
      "Ele define um período de teste de 3 segundos no qual a porta monitora o tipo de BPDU recebido para decidir se operará em modo MSTP ou em modo legado.",
      "Ele obriga a porta a aguardar 50 segundos antes de enviar qualquer tráfego de dados.",
      "Ele criptografa o tráfego de gerenciamento do Spanning Tree.",
      "Ele mede a latência exata do enlace óptico."
    ],
    "answer": "Ele define um período de teste de 3 segundos no qual a porta monitora o tipo de BPDU recebido para decidir se operará em modo MSTP ou em modo legado.",
    "explanation": "O temporizador de migração de 3 segundos é o mecanismo que permite à porta detectar BPDUs antigos de equipamentos vizinhos e ajustar automaticamente o seu formato de transmissão."
  },
  {
    "question": "O que é necessário fazer caso uma porta MSTP tenha chaveado para o modo legado após detectar um switch antigo, e o switch antigo tenha sido substituído por um modelo MSTP moderno?",
    "options": [
      "Reiniciar fisicamente todo o datacenter.",
      "Executar o comando CLI 'clear spanning-tree detected-protocols' para forçar a re-negociação do protocolo na interface.",
      "Alterar o Configuration Name da região para um valor aleatório.",
      "Desativar e reativar as VLANs afetadas no entroncamento."
    ],
    "answer": "Executar o comando CLI 'clear spanning-tree detected-protocols' para forçar a re-negociação do protocolo na interface.",
    "explanation": "Uma vez que o modo de compatibilidade legado é fixado na interface, a troca do hardware vizinho não reverte o comportamento automaticamente, exigindo o comando de limpeza para re-negociar."
  },
  {
    "question": "Qual endereço multicast de destino é utilizado pelos BPDUs do tipo SSTP gerados pelo switch MSTP para interagir com as VLANs não-nativas do PVST+?",
    "options": [
      "01:80:C2:00:00:00",
      "01:00:0C:CC:CC:CD",
      "01:80:C2:00:00:10",
      "FF02:0000:0000:0000:0000:0000:0000:0012"
    ],
    "answer": "01:00:0C:CC:CC:CD",
    "explanation": "O endereço multicast proprietário da Cisco '01:00:0C:CC:CC:CD' é utilizado para o tráfego de controle do PVST+ e SSTP, sendo empregado pelo motor de simulação do MSTP nas VLANs com tag."
  },
  {
    "question": "Por que o recurso de PVST Simulation vem ativado por padrão nas interfaces dos switches Cisco executando MSTP?",
    "options": [
      "Para garantir proteção automática e evitar loops acidentais quando a rede MSTP é conectada a infraestruturas legadas baseadas em PVST+.",
      "Para aumentar a largura de banda dos links de tronco em até 50%.",
      "Para substituir o protocolo STP por roteamento de Camada 3 de alta velocidade.",
      "Para permitir a compatibilidade com switches de fabricantes que não suportam o padrão IEEE 802.1Q."
    ],
    "answer": "Para garantir proteção automática e evitar loops acidentais quando a rede MSTP é conectada a infraestruturas legadas baseadas em PVST+.",
    "explanation": "O comportamento padrão de fábrica mantém o PVST Simulation habilitado para salvaguardar a rede de migrações parciais ou conexões imprevistas com domínios legados baseados por VLAN."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

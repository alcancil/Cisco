<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado MSTP - Dinâmica de TCN e Isolamento de Falhas por Instância (MSTI)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado MSTP - Dinâmica de TCN e Isolamento de Falhas por Instância (MSTI)</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre RSTP - Dinâmica de TCN e Isolamento de Falhas por Instância (MSTI). Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Qual é a principal diferença no comportamento de propagação de uma notificação de mudança de topologia (TCN) entre o Cisco PVST+ tradicional e o MSTP (IEEE 802.1s)?",
    "options": [
      "No PVST+, o TCN afeta apenas a porta alterada, enquanto no MSTP ele derruba toda a rede.",
      "No PVST+, um TCN gera flushes de tabela MAC por VLAN em todo o domínio, enquanto no MSTP o TCN é isolado e veiculado no M-Record da MSTI específica afetada, limitando o flush às VLANs daquela instância.",
      "No MSTP, as notificações de TCN foram completamente eliminadas e substituídas por keepalives UDP.",
      "O PVST+ não gera TCNs, operando estritamente com temporizadores estáticos de 50 segundos."
    ],
    "answer": "No PVST+, um TCN gera flushes de tabela MAC por VLAN em todo o domínio, enquanto no MSTP o TCN é isolado e veiculado no M-Record da MSTI específica afetada, limitando o flush às VLANs daquela instância.",
    "explanation": "O MSTP traz uma grande evolução arquitetural ao atrelar o TCN ao M-Record da MSTI correspondente, garantindo que o recálculo e o flush da tabela MAC ocorram apenas nas VLANs mapeadas para aquela instância, evitando o flooding desnecessário."
  },
  {
    "question": "Em um ambiente configurado com MSTP, o que acontece com o tráfego das VLANs pertencentes à MSTI 2 quando ocorre uma mudança de topologia tratada exclusivamente na MSTI 1?",
    "options": [
      "O tráfego da MSTI 2 sofre interrupção temporária e um flush completo de tabela MAC.",
      "O tráfego da MSTI 2 continua operando normalmente, sem sofrer flush na tabela MAC, pois a alteração é isolada na MSTI 1.",
      "A MSTI 2 é automaticamente convertida em MSTI 0 por medida de segurança contra loops.",
      "O switch reinicia as portas de acesso associadas à MSTI 2 para forçar uma nova convergência."
    ],
    "answer": "O tráfego da MSTI 2 continua operando normalmente, sem sofrer flush na tabela MAC, pois a alteração é isolada na MSTI 1.",
    "explanation": "Como o escopo de falhas e alterações de topologia no MSTP é particionado por instância, mudanças na MSTI 1 não impactam o plano de encaminhamento nem exigem limpeza de cache MAC para as VLANs da MSTI 2."
  },
  {
    "question": "No MSTP, qual evento físico ou lógico específico em uma interface é o responsável por desencadear a geração de uma notificação de mudança de topologia (TCN)?",
    "options": [
      "A queda física de um link redundante que possui caminho alternativo imediato via RSTP.",
      "A transição de uma porta não-borda (non-edge port) para o estado Forwarding.",
      "O recebimento de um pacote de gerenciamento ICMP originado por um roteador de Camada 3.",
      "A alteração do nome da região (Configuration Name) em um switch vizinho."
    ],
    "answer": "A transição de uma porta não-borda (non-edge port) para o estado Forwarding.",
    "explanation": "Seguindo a lógica herdada do RSTP, a simples queda de um link redundante com rota alternativa não gera TCN; a notificação ocorre estritamente quando uma porta não-borda passa a efetivamente encaminhar tráfego de dados."
  },
  {
    "question": "Como os switches localizados dentro de uma mesma Região MST tratam um TCN recebido através do M-Record de uma MSTI específica?",
    "options": [
      "Eles propagam o TCN para todas as VLANs da rede sem distinção.",
      "Eles limpam e esvaziam a tabela MAC estritamente para as VLANs mapeadas naquela MSTI específica.",
      "Eles bloqueiam permanentemente todas as portas trunk ligadas aos switches vizinhos.",
      "Eles ignoram o TCN, pois o MSTP confia apenas em temporizadores de envelhecimento (aging timer)."
    ],
    "answer": "Eles limpam e esvaziam a tabela MAC estritamente para as VLANs mapeadas naquela MSTI específica.",
    "explanation": "O isolamento de instâncias garante que o envelhecimento acelerado do cache de endereços MAC ocorra de forma cirúrgica, afetando apenas o subconjunto de VLANs pertencentes à MSTI que reportou a mudança."
  },
  {
    "question": "O que ocorre quando uma notificação de mudança de topologia (TCN) gerada dentro de uma Região MST atinge a borda da região (Boundary Port)?",
    "options": [
      "O Boundary Switch converte o TCN interno em um TCN do CIST ou em um BPDU de TCN compatível com o domínio externo legado.",
      "O Boundary Switch descarta o pacote TCN para proteger a rede interna contra instabilidades.",
      "A região inteira desfaz sua configuração e migra para o modo PVST+ automaticamente.",
      "As portas de borda entram em estado de erro (err-disable) por medidas de segurança."
    ],
    "answer": "O Boundary Switch converte o TCN interno em um TCN do CIST ou em um BPDU de TCN compatível com o domínio externo legado.",
    "explanation": "A fronteira regional atua como um tradutor de protocolos. Quando um evento de mudança de topologia atinge a borda, ele é traduzido para o formato que os switches externos (sejam MSTP de outra região ou PVST+ legados) compreendem."
  },
  {
    "question": "Por que o design de TCN por MSTI no MSTP reduz drasticamente o impacto de instabilidades de link em grandes redes corporativas em comparação ao PVST+?",
    "options": [
      "Porque o MSTP utiliza velocidades de link de 100 Gbps que eliminam a necessidade de processar BPDUs.",
      "Porque evita o 'broadcast storm' de flushes de tabela MAC em VLANs que não sofreram nenhuma alteração topológica.",
      "Porque desativa o processamento de CPU nos switches de acesso durante quedas de enlaces.",
      "Porque obriga todas as VLANs a convergirem em um tempo fixo de 50 segundos."
    ],
    "answer": "Porque evita o 'broadcast storm' de flushes de tabela MAC em VLANs que não sofreram nenhuma alteração topológica.",
    "explanation": "Em redes com milhares de VLANs rodando PVST+, qualquer oscilação de link gerava flushes em massa em todas as instâncias. No MSTP, o agrupamento em instâncias restringe o escopo do flush, preservando o desempenho dos switches."
  },
  {
    "question": "Qual estrutura dentro do quadro de BPDU do MSTP é utilizada para transportar as informações de TCN e estado de instâncias individuais (como a MSTI 1 ou MSTI 2)?",
    "options": [
      "O cabeçalho base do IEEE 802.1D clássico.",
      "A extensão MST (Configuration Regional) e os registros M-Records anexados ao BPDU.",
      "O campo de Endereço MAC de destino do multicast da Cisco.",
      "O cabeçalho proprietário do protocolo CDP (Cisco Discovery Protocol)."
    ],
    "answer": "A extensão MST (Configuration Regional) e os registros M-Records anexados ao BPDU.",
    "explanation": "O MSTP transmite um único BPDU físico baseado no IST (MSTI 0) e utiliza blocos de dados chamados M-Records anexados ao final para transportar o estado individual de cada MSTI adicional."
  },
  {
    "question": "Se um link de acesso conectado a um terminal final (como um computador) oscilar e cair em uma porta configurada com PortFast dentro de uma rede MSTP, haverá geração de TCN?",
    "options": [
      "Sim, qualquer evento de interface gera imediatamente um TCN regional.",
      "Não, portas configuradas como PortFast (Edge Ports) não geram notificações de mudança de topologia ao alterarem seu estado.",
      "Sim, mas apenas para as VLANs da MSTI 0, gerando impacto na MSTI 1.",
      "Não, o switch reinicia a interface para bloquear o tráfego de broadcast."
    ],
    "answer": "Não, portas configuradas como PortFast (Edge Ports) não geram notificações de mudança de topologia ao alterarem seu estado.",
    "explanation": "Portas de borda (Edge Ports) conectadas a dispositivos finais não participam ativamente da computação de topologia do spanning tree, portanto, alterações nelas não disparam TCNs, evitando flushes desnecessários na rede."
  },
  {
    "question": "Em um cenário de falha onde uma MSTI interna sofre uma mudança de topologia, qual componente dentro do switch é o principal responsável por atualizar o encaminhamento de pacotes nas portas afetadas?",
    "options": [
      "O plano de controle do Spanning Tree que recalcula os papéis das portas e comanda o flush na tabela CAM/MAC da respectiva instância.",
      "O roteador de Camada 3 através de atualizações dinâmicas de tabelas ARP.",
      "O módulo de fonte redundante do switch.",
      "O driver da placa de rede física do terminal conectado."
    ],
    "answer": "O plano de controle do Spanning Tree que recalcula os papéis das portas e comanda o flush na tabela CAM/MAC da respectiva instância.",
    "explanation": "Quando uma topologia de MSTI converge após uma falha, o plano de controle atualiza o estado de encaminhamento e aciona o mecanismo de limpeza de endereços MAC vinculados àquela instância específica."
  },
  {
    "question": "Qual é a relação entre a MSTI 0 (IST - Internal Spanning Tree) e as demais MSTIs (MSTI 1 a 4094) no que diz respeito à sincronização de eventos de topologia?",
    "options": [
      "A MSTI 0 é totalmente isolada e não possui qualquer influência sobre as MSTIs adicionais.",
      "A MSTI 0 serve como a árvore mestre de controle; eventos estruturais globais e handshakes principais ocorrem nela, sincronizando as demais instâncias através do mesmo plano de controle subjacente.",
      "As MSTIs adicionais controlam a MSTI 0 de forma hierárquica reversa.",
      "A MSTI 0 opera exclusivamente com o protocolo Spanning Tree clássico de 1998."
    ],
    "answer": "A MSTI 0 serve como a árvore mestre de controle; eventos estruturais globais e handshakes principais ocorrem nela, sincronizando as demais instâncias através do mesmo plano de controle subjacente.",
    "explanation": "A MSTI 0 (IST) gerencia a topologia interna da região e carrega o corpo principal do BPDU, coordenando a base estrutural sobre a qual as instâncias de usuário (MSTIs) operam e se sincronizam."
  }
      
      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

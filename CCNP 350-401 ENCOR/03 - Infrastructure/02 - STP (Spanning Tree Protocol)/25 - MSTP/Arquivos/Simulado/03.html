<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado MSTP - Engenharia de Custos: Avaliando ERPC, IRPC e o Limite de Saltos (Hop Count)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado MSTP - Engenharia de Custos: Avaliando ERPC, IRPC e o Limite de Saltos (Hop Count)</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre MSTP - Engenharia de Custos: Avaliando ERPC, IRPC e o Limite de Saltos (Hop Count). Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Qual é a definição exata do ERPC (External Root Path Cost) em um ambiente operando com MSTP?",
    "options": [
      "É o custo acumulado de caminho para alcançar o CIST Root global, o qual permanece inalterado enquanto o BPDU trafega internamente por toda a região MST.",
      "É o custo somado de todas as interfaces físicas conectadas aos servidores de borda.",
      "É a métrica estática que substitui o temporizador de Forward Delay nas portas de acesso.",
      "É o valor do contador de saltos decrementado a cada transição de porta."
    ],
    "answer": "É o custo acumulado de caminho para alcançar o CIST Root global, o qual permanece inalterado enquanto o BPDU trafega internamente por toda a região MST.",
    "explanation": "O ERPC representa o custo total desde a raiz global da rede até a entrada da região. Dentre os switches internos da mesma região, esse valor é mantido constante para unificar a visão externa da Virtual Bridge."
  },
  {
    "question": "Como o IRPC (Internal Root Path Cost) se comporta à medida que os BPDUs se deslocam internamente de um switch para outro dentro de uma mesma Região MST?",
    "options": [
      "O IRPC diminui progressivamente até zerar na borda oposta da região.",
      "O IRPC aumenta de forma acumulativa a cada salto dentro da região com base nos custos das portas intermediárias.",
      "O IRPC permanece estático e idêntico em todos os nós da região.",
      "O IRPC é zerado sempre que cruza uma porta designada."
    ],
    "answer": "O IRPC aumenta de forma acumulativa a cada salto dentro da região com base nos custos das portas intermediárias.",
    "explanation": "Enquanto o ERPC é constante, o IRPC reflete o custo interno da região em direção à raiz regional, acumulando o valor do custo de link a cada salto percorrido."
  },
  {
    "question": "Qual é a finalidade principal do campo Hop Count (Remaining Hops) inserido nos BPDUs dentro de uma Região MST?",
    "options": [
      "Garantir a criptografia simétrica dos pacotes de controle entre os switches.",
      "Prevenir loops de Camada 2 causados por tempestades de BPDUs, decrementando o valor a cada salto até atingir zero e expirar a informação.",
      "Aumentar artificialmente a velocidade de convergência do Rapid-PVST+.",
      "Substituir o endereço MAC de origem da Root Bridge."
    ],
    "answer": "Prevenir loops de Camada 2 causados por tempestades de BPDUs, decrementando o valor a cada salto até atingir zero e expirar a informação.",
    "explanation": "O contador de saltos (Hop Count) protege o plano de controle contra loops de BPDUs dentro da região MST, descartando o pacote se o limite de saltos remanescentes esgotar."
  },
  {
    "question": "Qual é o valor padrão atribuído ao contador Hop Count (Max Hops) nas configurações de switches Cisco IOS XE rodando MSTP?",
    "options": [
      "10 saltos",
      "20 saltos",
      "50 saltos",
      "255 saltos"
    ],
    "answer": "20 saltos",
    "explanation": "O valor padrão configurado nos sistemas Cisco IOS XE para o limite de saltos (Max Hops) em uma região MST é 20, podendo ser ajustado pelo administrador se necessário."
  },
  {
    "question": "Se um switch interno dentro de uma região MST recebe um BPDU cujo campo Hop Count chegou a 0, qual é a ação imediata executada pelo protocolo?",
    "options": [
      "O switch reinicia automaticamente o módulo Supervisor.",
      "O BPDU é descartado e as informações daquela porta expiram, prevenindo loops na topologia.",
      "O switch converte a porta para o modo de acesso inativo.",
      "A prioridade da MSTI é duplicada de forma instantânea."
    ],
    "answer": "O BPDU é descartado e as informações daquela porta expiram, prevenindo loops na topologia.",
    "explanation": "A contagem de saltos serve como mecanismo de segurança; quando atinge zero, indica que o BPDU circulou excessivamente ou a distância excedeu o planejado, resultando no seu descarte."
  },
  {
    "question": "Como o custo total de caminho para o CIST (CIST Path Cost) é calculado por um switch interno que está situado dentro de uma Região MST?",
    "options": [
      "Apenas pelo valor do ERPC, desconsiderando o custo interno.",
      "Através da soma matemática entre o ERPC (Custo Externo) e o IRPC (Custo Interno).",
      "Multiplicando o número de VLANs ativas pelo valor do Revision Number.",
      "Subtraindo o Hop Count do valor da prioridade do Bridge ID."
    ],
    "answer": "Através da soma matemática entre o ERPC (Custo Externo) e o IRPC (Custo Interno).",
    "explanation": "Para que os switches internos saibam o custo completo até a raiz global situada fora da região, o custo total do caminho CIST é composto pela soma do custo externo (ERPC) com o custo interno acumulado (IRPC)."
  },
  {
    "question": "O que ocorre com o valor do ERPC reportado por um Boundary Switch para os demais switches internos da sua região quando o link externo principal sofre alteração de largura de banda?",
    "options": [
      "O ERPC é recalculado e atualizado nos BPDUs propagados internamente para refletir o novo custo do caminho até o CIST Root global.",
      "O ERPC é zerado permanentemente para evitar instabilidades.",
      "O ERPC permanece fixo e imutável, exigindo reboot manual.",
      "O ERPC é convertido em unidades de tempo de atraso."
    ],
    "answer": "O ERPC é recalculado e atualizado nos BPDUs propagados internamente para refletir o novo custo do caminho até o CIST Root global.",
    "explanation": "Embora o ERPC seja constante dentro da região para um mesmo caminho, se a topologia externa mudar e o Boundary Switch recalcular a rota para o CIST Root global, o novo valor de ERPC será propagado para toda a região."
  },
  {
    "question": "Qual comando de configuração global no Cisco IOS XE permite alterar o limite máximo de saltos (Hop Count) de uma região MST?",
    "options": [
      "spanning-tree mst max-hops <valor>",
      "spanning-tree mst hop-limit <valor>",
      "spanning-tree vlan max-path <valor>",
      "spanning-tree mode mst limit-hops <valor>"
    ],
    "answer": "spanning-tree mst max-hops <valor>",
    "explanation": "O comando de configuração global 'spanning-tree mst max-hops' define o valor inicial do contador de saltos que a raiz regional injeta nos BPDUs."
  },
  {
    "question": "Por que o MSTP utiliza o conceito de Hop Count em vez de ajustar os temporizadores Max Age e Forward Delay a cada salto dentro de uma região?",
    "options": [
      "Porque o uso de temporizadores baseados em tempo em redes grandes causava convergência lenta e instabilidade de temporização a cada novo salto de switch.",
      "Porque os temporizadores tradicionais consomem toda a memória flash do equipamento.",
      "Porque o padrão IEEE 802.1s proíbe o uso de segundos em redes de Camada 2.",
      "Porque o Hop Count acelera o roteamento IP de pacotes unicast."
    ],
    "answer": "Porque o uso de temporizadores baseados em tempo em redes grandes causava convergência lenta e instabilidade de temporização a cada novo salto de switch.",
      "explanation": "Em redes corporativas extensas, recalcular timers baseados em tempo a cada salto gerava falhas de sincronização. O Hop Count baseado em contagem de saltos garante estabilidade e controle rígido do raio de propagação do BPDU."
  },
  {
    "question": "Em uma topologia MSTP, se o administrador deseja que o raio máximo de propagação dos BPDUs internos seja restrito por motivos de segurança e design de rede, qual parâmetro ele deve ajustar?",
    "options": [
      "O Configuration Name da região.",
      "O Max Hops (Contador de Saltos).",
      "O Revision Number.",
      "O System ID Extension da MSTI 0."
    ],
    "answer": "O Max Hops (Contador de Saltos).",
    "explanation": "Ajustar o parâmetro Max Hops permite controlar estritamente a profundidade máxima em número de switches que um BPDU pode percorrer dentro da região antes de expirar."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

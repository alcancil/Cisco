<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado MSTP - Comandos de Diagnóstico, CLI e Análise de Captura de BPDUs no Wireshark</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado MSTP - Comandos de Diagnóstico, CLI e Análise de Captura de BPDUs no Wireshark</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre MSTP - Comandos de Diagnóstico, CLI e Análise de Captura de BPDUs no Wireshark. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    "question": "Qual comando no Cisco IOS XE exibe a tabela completa de mapeamento de VLANs por instância e permite comparar diretamente o Hash MD5 (Digest) da região MST?",
    "options": [
      "show spanning-tree mst configuration",
      "show spanning-tree summary",
      "show spanning-tree detail",
      "show vlan brief"
    ],
    "answer": "show spanning-tree mst configuration",
    "explanation": "O comando 'show spanning-tree mst configuration' lista o nome da região, o número de revisão e a distribuição exata de VLANs mapeadas em cada MSTI, essencial para validar a consistência entre switches."
  },
  {
    "question": "Ao inspecionar a saída do comando `show spanning-tree mst configuration digest`, qual informação deve ser idêntica em todos os switches da mesma Região MST para evitar a fragmentação (partitioning)?",
    "options": [
      "O endereço MAC da interface VLAN 1.",
      "A string hexadecimal de 16 bytes que representa a assinatura MD5 do mapeamento regional.",
      "O tempo decorrido desde o último reboot da caixa.",
      "O número da porta Ethernet conectada ao switch vizinho."
    ],
    "answer": "A string hexadecimal de 16 bytes que representa a assinatura MD5 do mapeamento regional.",
    "explanation": "Se a hash MD5 gerada (Digest) for diferente entre dois switches por qualquer caractere, a região se fragmenta e a interconexão degrada para o comportamento de Boundary Port."
  },
  {
    "question": "Qual comando fornece uma visão consolidada de todas as instâncias (MSTI 0, MSTI 1, etc.), indicando o papel do switch local (ROOT ou SUBORD) e o custo acumulado em cada uma delas?",
    "options": [
      "show spanning-tree mst summary",
      "show interfaces trunk",
      "show running-config | section mst",
      "show cdp neighbors detail"
    ],
    "answer": "show spanning-tree mst summary",
    "explanation": "O comando 'show spanning-tree mst summary' fornece um resumo em formato de tabela exibindo a identidade do switch, o papel em cada MSTI e os custos totais de caminho."
  },
  {
    "question": "Ao analisar a captura de um BPDU MSTP no Wireshark, em qual seção do pacote estão contidas as informações específicas sobre o estado, prioridade e Root ID das instâncias MSTI 1 a 64?",
    "options": [
      "No cabeçalho Ethernet II de broadcast universal.",
      "Nos campos de registro individual chamados M-Records (Multiple Spanning Tree Records) anexados à extensão do BPDU.",
      "No campo Option 82 do protocolo DHCP.",
      "No parâmetro Time-to-Live (TTL) do cabeçalho IPv4."
    ],
    "answer": "Nos campos de registro individual chamados M-Records (Multiple Spanning Tree Records) anexados à extensão do BPDU.",
    "explanation": "O MSTP envia apenas um BPDU físico (baseado na MSTI 0) contendo estruturas chamadas M-Records ao final, onde cada M-Record carrega os dados de topologia de uma MSTI específica."
  },
  {
    "question": "Ao inspecionar uma porta através do comando `show spanning-tree mst 1`, a coluna de tipo exibe `P2p Bound(PVST)`. O que esse status indica ao engenheiro de rede?",
    "options": [
      "A interface está enfrentando uma falha de hardware e desativou o envio de quadros.",
      "A interface é uma Boundary Port conectada a um switch legado operando no modo PVST+.",
      "A porta está agregada em um EtherChannel com protocolo LACP.",
      "A instância MSTI 1 foi excluída da tabela de encaminhamento."
    ],
    "answer": "A interface é uma Boundary Port conectada a um switch legado operando no modo PVST+.",
    "explanation": "A notificação 'P2p Bound(PVST)' sinaliza que a porta opera em modo Point-to-Point, mas detectou vizinhos legados PVST+, ativando o mecanismo de simulação e interconexão de borda."
  },
  {
    "question": "Se uma porta de um switch MSTP estiver bloqueada exibindo a razão `*pvt-incons` na saída do comando `show spanning-tree interface`, qual comando de diagnóstico ajuda a confirmar o motivo da inconsistência?",
    "options": [
      "show log (ou show logging) para verificar os alertas do sistema `%SPANTREE-2-PVSTSIM_FAIL`.",
      "show ip route para analisar a tabela de roteamento estático.",
      "show processes cpu para medir o uso do processador.",
      "show power inline para checar o fornecimento de energia PoE."
    ],
    "answer": "show log (ou show logging) para verificar os alertas do sistema `%SPANTREE-2-PVSTSIM_FAIL`.",
    "explanation": "Alertas de falha na simulação de PVST são registrados no log do sistema com a mensagem `%SPANTREE-2-PVSTSIM_FAIL`, detalhando qual VLAN ou BPDU superior provocou o bloqueio da interface."
  },
  {
    "question": "Qual comando no modo EXEC privilegioso força uma interface MSTP a reiniciar o Migration Delay Timer e tentar renegociar o protocolo MSTP nativo com o switch vizinho?",
    "options": [
      "clear spanning-tree detected-protocols",
      "reload switch prompt",
      "spanning-tree mst reset-interface",
      "clear mac address-table dynamic"
    ],
    "answer": "clear spanning-tree detected-protocols",
    "explanation": "O comando 'clear spanning-tree detected-protocols' faz com que a porta limpe o histórico de detecção de BPDUs antigos e envie novamente BPDUs 802.1s nativos para renegociar o modo de operação."
  },
  {
    "question": "Ao analisar um BPDU MSTP capturado no Wireshark, qual valor no campo Protocol Version Identifier confirma que o quadro pertence ao padrão IEEE 802.1s (MSTP)?",
    "options": [
      "Protocol Version Identifier: 0 (STP Clássico)",
      "Protocol Version Identifier: 2 (RSTP)",
      "Protocol Version Identifier: 3 (MSTP)",
      "Protocol Version Identifier: 4 (BGP)"
    ],
    "answer": "Protocol Version Identifier: 3 (MSTP)",
    "explanation": "No Wireshark, o campo de versão do protocolo Spanning Tree define a norma utilizada: 0 para 802.1D clássico, 2 para 802.1w (RSTP) e 3 para 802.1s (MSTP)."
  },
  {
    "question": "Qual filtro do Wireshark pode ser utilizado por um engenheiro para isolar estritamente o tráfego de BPDUs do Spanning Tree durante uma captura em uma porta trunk?",
    "options": [
      "stp ou stp.flags",
      "ip.addr == 192.168.1.1",
      "tcp.port == 80",
      "dns || dhcp"
    ],
    "answer": "stp ou stp.flags",
    "explanation": "O filtro de exibição 'stp' (ou especificidades como 'stp.flags' e 'stp.mst') isola todos os quadros de controle de Spanning Tree capturados na interface."
  },
  {
    "question": "O que indica a presença da flag 'Agreement' marcada como 'True' no cabeçalho CIST de um BPDU MSTP analisado no Wireshark?",
    "options": [
      "O switch emissor concorda com a eleição da raiz e confirma a convergência rápida para a porta em transição.",
      "O switch está solicitando o desligamento da interface por superaquecimento.",
      "A Região MST foi dividida em duas áreas autônomas.",
      "O pacote foi descartado devido ao esgotamento do Hop Count."
    ],
    "answer": "O switch emissor concorda com a eleição da raiz e confirma a convergência rápida para a porta em transição.",
    "explanation": "A flag 'Agreement' ativada no BPDU sinaliza a conclusão bem-sucedida do handshake Proposal/Agreement do RSTP/MSTP, permitindo que a porta entre no estado de encaminhamento (Forwarding) sem esperas por temporizadores estáticos."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado RSTP - TWireshark: Análise das Flags do BPDU e Troubleshooting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado RSTP - Wireshark: Análise das Flags do BPDU e Troubleshooting</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre RSTP - Wireshark: Análise das Flags do BPDU e Troubleshooting. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    question: "No Wireshark, qual filtro é utilizado para visualizar APENAS os BPDUs que pertencem ao RSTP (802.1w), excluindo os BPDUs do STP clássico?",
    options: [
      "stp",
      "stp.version == 0",
      "stp.version == 2",
      "stp.flags.proposal == 1"
    ],
    answer: "stp.version == 2",
    explanation: "Conforme a Seção 4.1, o filtro 'stp.version == 2' é utilizado para isolar os BPDUs do RSTP, que utilizam a Versão 2. O STP clássico utiliza a Versão 0."
  },
  {
    question: "Qual comando de filtro no Wireshark deve ser utilizado para identificar rapidamente se um BPDU está sinalizando uma mudança de topologia (Topology Change) na rede?",
    options: [
      "stp.flags.agreement == 1",
      "stp.flags.proposal == 1",
      "stp.flags.tc == 1",
      "stp.flags.tca == 1"
    ],
    answer: "stp.flags.tc == 1",
    explanation: "De acordo com a Seção 4.1, o filtro 'stp.flags.tc == 1' é o comando correto para filtrar eventos de Topology Change no RSTP."
  },
  {
    question: "No cabeçalho do BPDU RSTP, qual é a função do Bit 5 no campo de Flags?",
    options: [
      "Indicar que a porta remetente está no estado de Learning.",
      "Indicar que a porta remetente está no estado de Forwarding (encaminhando tráfego ativamente).",
      "Confirmar o recebimento de uma Proposal.",
      "Sinalizar que ocorreu uma mudança de topologia."
    ],
    answer: "Indicar que a porta remetente está no estado de Forwarding (encaminhando tráfego ativamente).",
    explanation: "A Seção 4.2 detalha que o Bit 5 é a flag Forwarding (Fwd). Quando ativa, indica que a porta remetente está no estado de Forwarding."
  },
  {
    question: "Ao analisar uma captura no Wireshark, você observa que os bits 3 e 2 (Port Role) de um BPDU RSTP estão configurados como '10'. O que isso indica?",
    options: [
      "Que a porta é uma Designated Port.",
      "Que a porta é uma Root Port.",
      "Que a porta é uma Alternate ou Backup Port.",
      "Que a porta está com o papel desconhecido (Unknown)."
    ],
    answer: "Que a porta é uma Root Port.",
    explanation: "Conforme a tabela da Seção 4.2, o valor binário '10' nos bits 2 e 3 indica que a porta transmissora é uma Root Port. O valor '11' indicaria Designated Port."
  },
  {
    question: "Qual comando 'show' é utilizado para verificar detalhes específicos de uma interface, como papéis, estados, temporizadores e tipo de link no RSTP?",
    options: [
      "show spanning-tree summary",
      "show spanning-tree vlan 10",
      "show spanning-tree interface gigabitethernet 0/1 detail",
      "show spanning-tree interface gigabitethernet 0/1 counters"
    ],
    answer: "show spanning-tree interface gigabitethernet 0/1 detail",
    explanation: "A Seção 3.1 especifica que o comando 'show spanning-tree interface gigabitethernet 0/1 detail' exibe detalhes de papéis, estados, temporizadores e tipo de link de uma interface específica."
  },
  {
    question: "Qual comando é sugerido na Seção 3.1 para verificar especificamente os contadores de BPDUs enviados/recebidos e o número de transições de topologia em uma interface?",
    options: [
      "show spanning-tree interface gigabitethernet 0/1 detail | include BPDU|number of topology",
      "show spanning-tree interface gigabitethernet 0/1 statistics",
      "show spanning-tree bpdu counters",
      "show spanning-tree topology changes"
    ],
    answer: "show spanning-tree interface gigabitethernet 0/1 detail | include BPDU|number of topology",
    explanation: "A Seção 3.1 recomenda o uso do pipe (|) com o include para filtrar a saída do comando detail, exibindo apenas as linhas que contenham 'BPDU' ou 'number of topology'."
  },
  {
    question: "Qual comando de depuração (debug) deve ser utilizado para monitorar em tempo real o envio de BPDUs por um switch Cisco?",
    options: [
      "debug spanning-tree events",
      "debug spanning-tree bpdu receive",
      "debug spanning-tree bpdu transmit",
      "debug spanning-tree all"
    ],
    answer: "debug spanning-tree bpdu transmit",
    explanation: "Conforme a Seção 3.2, o comando 'debug spanning-tree bpdu transmit' é utilizado para depurar o envio de BPDUs em tempo real."
  },
  {
    question: "Qual é a recomendação de segurança e boas práticas ao utilizar comandos 'debug' em um ambiente de produção, de acordo com o README?",
    options: [
      "Utilizar sempre em produção, pois não há impacto no switch.",
      "Utilizar apenas em ambiente de laboratório para evitar sobrecarga de CPU em produção.",
      "Utilizar apenas durante o horário comercial para monitorar os usuários.",
      "Utilizar em conjunto com o comando 'spanning-tree portfast' para evitar loops."
    ],
    answer: "Utilizar apenas em ambiente de laboratório para evitar sobrecarga de CPU em produção.",
    explanation: "A Seção 3.2 contém um aviso explícito (⚠️ Atenção) recomendando o uso de comandos debug apenas em ambiente de laboratório para evitar sobrecarga de CPU em produção."
  },
  {
    question: "No campo de Flags do BPDU RSTP, qual é a função do Bit 7 (TCA - Topology Change Acknowledgment)?",
    options: [
      "Sinalizar que a porta remetente está no estado de Learning.",
      "Confirmar a mudança de topologia, herdado por motivos de compatibilidade retroativa com o STP clássico (802.1D).",
      "Indicar que a porta remetente é uma Alternate Port.",
      "Solicitar a sincronização imediata das portas não-Edge."
    ],
    answer: "Confirmar a mudança de topologia, herdado por motivos de compatibilidade retroativa com o STP clássico (802.1D).",
    explanation: "A Seção 4.2 explica que o Bit 7 (TCA) foi herdado do STP clássico (802.1D) para confirmar o recebimento de notificações de mudança de topologia, mantendo a compatibilidade retroativa."
  },
  {
    question: "Você está analisando uma captura no Wireshark e aplica o filtro 'stp.flags.agreement == 1'. O que você espera encontrar como resultado desse filtro?",
    options: [
      "BPDUs que estão iniciando o processo de convergência (Proposal).",
      "BPDUs que sinalizam uma mudança de topologia.",
      "BPDUs de resposta que confirmam a sincronização (Sync) das portas, permitindo a transição para Forwarding.",
      "BPDUs do STP clássico (Versão 0)."
    ],
    answer: "BPDUs de resposta que confirmam a sincronização (Sync) das portas, permitindo a transição para Forwarding.",
    explanation: "Conforme a Seção 4.1, o filtro 'stp.flags.agreement == 1' isola os BPDUs com a flag Agreement ativa. A Seção 4.2 explica que essa flag é a resposta síncrona à Proposal, confirmando que o vizinho concluiu o Sync."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

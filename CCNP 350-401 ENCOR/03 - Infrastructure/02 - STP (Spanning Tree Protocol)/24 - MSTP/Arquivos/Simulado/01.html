<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado de MSTP - Evolução do STP ao MSTP: CST, PVST+ e O Equilíbrio Perfeito</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">
    <div id="start-screen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Simulado de MSTP - Evolução do STP ao MSTP: CST, PVST+ e O Equilíbrio Perfeito</h1>
      <p class="mb-6 text-slate-600">Este simulado contém 10 questões sobre MSTP - Evolução do STP ao MSTP: CST, PVST+ e O Equilíbrio Perfeito. Você terá 10 minutos para concluir.</p>
      <div class="max-w-sm mx-auto mb-4">
  <label for="user-name" class="block text-left text-sm font-medium text-slate-700 mb-1">Seu nome</label>
  <input id="user-name" type="text" placeholder="Digite seu nome" class="w-full px-3 py-2 rounded-lg border" />
</div>
<button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Iniciar</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="timer" class="font-semibold text-slate-700">Tempo: 10:00</span>
        <span id="question-number" class="font-semibold text-slate-700">1</span>
      </div>

      <div class="w-full bg-slate-200 rounded-full h-3 mb-6">
        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-3"></div>
      <button id="next-btn" onclick="nextQuestion()" disabled class="mt-6 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Próxima Questão</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-4">Resultado</h2>
      <p id="score" class="mb-4 text-lg"></p>
      <div id="review" class="text-left space-y-4"></div>
      <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">Refazer Simulado</button>
    </div>
  </div>

  <script>
    const quizData = [
  {
    question: "Qual foi a principal limitação arquitetural do IEEE 802.1D (CST - Common Spanning Tree) que motivou o desenvolvimento de abordagens alternativas para redes corporativas?",
    options: [
      "A exigência de processar BPDUs individualmente para cada VLAN existente na rede.",
      "O uso de uma única instância lógica de Spanning Tree compartilhada por todas as VLANs, impedindo o balanceamento de carga entre links redundantes.",
      "A incapacidade de operar em switches de fabricantes diferentes (multivendor).",
      "O tempo de convergência extremamente rápido que desestabilizava as tabelas CAM dos switches centrais."
    ],
    answer: "O uso de uma única instância lógica de Spanning Tree compartilhada por todas as VLANs, impedindo o balanceamento de carga entre links redundantes.",
    explanation: "O CST clássico mantinha apenas uma árvore lógica para toda a rede. Caso houvesse links redundantes, eles ficavam bloqueados uniformemente, impedindo o uso ativo-ativo de caminhos diferentes para o tráfego de dados."
  },
  {
    question: "Como o Cisco PVST+ (Per-VLAN Spanning Tree Plus) solucionou o problema de balanceamento de carga que existia no CST clássico?",
    options: [
      "Agrupando todas as VLANs em apenas duas instâncias lógicas independentes.",
      "Mantendo uma instância de Spanning Tree totalmente independente para cada VLAN configurada na rede.",
      "Eliminando completamente o uso de BPDUs e utilizando o algoritmo de roteamento OSPF em Camada 2.",
      "Forçando o tráfego de todas as VLANs a passar obrigatoriamente pela mesma porta física (Root Port)."
    ],
    answer: "Mantendo uma instância de Spanning Tree totalmente independente para cada VLAN configurada na rede.",
    explanation: "O PVST+ roda uma árvore de Spanning Tree separada para cada VLAN, permitindo que administradores definam Root Bridges diferentes por VLAN e distribuam o tráfego de forma otimizada pelos links redundantes."
  },
  {
    question: "Apesar de permitir o balanceamento de carga por VLAN, qual é o principal calcanhar de Aquiles (desvantagem) operacional do PVST+ / Rapid-PVST+ em redes de grande porte?",
    options: [
      "A incompatibilidade com switches de Camada 3 de mercado.",
      "O alto consumo de CPU e memória nos switches devido à necessidade de processar centenas ou milhares de instâncias e BPDUs independentes.",
      "A obrigatoriedade de utilizar cabos de fibra óptica em todas as portas de acesso.",
      "O tempo de convergência fixo de 50 segundos que não pode ser reduzido."
    ],
    answer: "O alto consumo de CPU e memória nos switches devido à necessidade de processar centenas ou milhares de instâncias e BPDUs independentes.",
    explanation: "Com 1.000 VLANs, o PVST+ exige o processamento de 1.000 instâncias e o envio massivo de BPDUs a cada 2 segundos, sobrecarregando o plano de controle dos switches."
  },
  {
    question: "Qual é a principal proposta de valor do IEEE 802.1s (MSTP - Multiple Spanning Tree Protocol) ao comparar com o PVST+ e o CST?",
    options: [
      "Criar uma única árvore para toda a rede sem suporte a VLANs.",
      "Oferecer o equilíbrio perfeito: agrupar VLANs em instâncias lógicas reduzidas para garantir balanceamento de carga sem sobrecarregar a CPU com milhares de instâncias.",
      "Substituir totalmente o protocolo IP por endereçamento MAC em redes corporativas.",
      "Eliminar a necessidade de eleição de Root Bridge nas redes modernas."
    ],
    answer: "Oferecer o equilíbrio perfeito: agrupar VLANs em instâncias lógicas reduzidas para garantir balanceamento de carga sem sobrecarregar a CPU com milhares de instâncias.",
    explanation: "O MSTP resolve o dilema de escala permitindo que o engenheiro agrupe milhares de VLANs em poucas instâncias (ex: 2 ou 3), unindo o melhor dos dois mundos (escalabilidade do CST + balanceamento do PVST+)."
  },
  {
    question: "Do ponto de vista normativo e de ecossistema, qual é uma diferença fundamental entre o PVST+ e o MSTP (802.1s)?",
    options: [
      "O PVST+ é um padrão aberto do IEEE, enquanto o MSTP é um protocolo estritamente proprietário da Cisco.",
      "O PVST+ é um protocolo proprietário da Cisco Systems, enquanto o MSTP é um padrão aberto IEEE (incorporado ao IEEE 802.1Q).",
      "Ambos são protocolos proprietários criados exclusivamente para equipamentos da Cisco.",
      "Ambos são padrões abertos da IETF regidos por RFCs de Camada 3."
    ],
    answer: "O PVST+ é um protocolo proprietário da Cisco Systems, enquanto o MSTP é um padrão aberto IEEE (incorporado ao IEEE 802.1Q).",
    explanation: "O PVST+ utiliza extensões proprietárias da Cisco (frequentemente encapsulando BPDUs na VLAN 1 com endereços multicast específicos), ao passo que o MSTP (802.1s) é um padrão aberto da IEEE, garantindo interoperabilidade multi-vendor."
  },
  {
    question: "No contexto da evolução histórica descrita no guia, qual é o padrão IEEE oficial associado diretamente à especificação do MSTP?",
    options: [
      "IEEE 802.1D",
      "IEEE 802.1w",
      "IEEE 802.1s",
      "IEEE 802.3ad"
    ],
    answer: "IEEE 802.1s",
    explanation: "O IEEE 802.1s foi a emenda original que introduziu o Multiple Spanning Tree Protocol, posteriormente consolidado dentro do padrão global de bridges e VLANs IEEE 802.1Q."
  },
  {
    question: "Em uma rede Enterprise de grande porte com mais de 1.000 VLANs ativas em ambientes multi-vendor (misturando switches Cisco, HP e Aruba), qual tecnologia de Spanning Tree é fortemente recomendada pelo blueprint do CCNP ENCOR?",
    options: [
      "STP Clássico (802.1D)",
      "Cisco PVST+",
      "MSTP (IEEE 802.1s)",
      "Spanning Tree desativado globalmente"
    ],
    answer: "MSTP (IEEE 802.1s)",
    explanation: "O MSTP é a solução definitiva de engenharia para redes de grande porte e ambientes multi-vendor, pois suporta agrupamento de VLANs em instâncias e é um padrão aberto."
  },
  {
    question: "Qual cenário técnico descrito no material justifica a *NÃO* utilização do MSTP em uma rede corporativa?",
    options: [
      "Redes de pequeno porte com menos de 20 VLANs, onde a complexidade de configuração supera os ganhos de otimização de CPU.",
      "Redes que utilizam roteamento de Camada 3 nos switches de acesso.",
      "Redes que operam estritamente com equipamentos de um único fabricante.",
      "Redes que exigem convergência abaixo de 2 segundos."
    ],
    answer: "Redes de pequeno porte com menos de 20 VLANs, onde a complexidade de configuração supera os ganhos de otimização de CPU.",
    explanation: "Em infraestruturas muito pequenas, o ganho de processamento de CPU é marginal, não compensando o overhead operacional e o cuidado necessário na configuração dos atributos de região (Digest, Nome, Revisão)."
  },
  {
    question: "Comparando o uso de recursos de hardware, qual é a principal vantagem do MSTP em relação ao Rapid-PVST+?",
    options: [
      "O MSTP consome muita CPU, mas economiza espaço em disco nos switches.",
      "O MSTP consome recursos de CPU proporcionais ao número de instâncias criadas (geralmente poucas), e não ao número massivo de VLANs.",
      "O MSTP elimina totalmente o uso de memória RAM para tabelas de topologia.",
      "O Rapid-PVST+ não utiliza BPDUs, o que sobrecarrega mais o hardware do que o MSTP."
    ],
    answer: "O MSTP consome recursos de CPU proporcionais ao número de instâncias criadas (geralmente poucas), e não ao número massivo de VLANs.",
    explanation: "Enquanto o Rapid-PVST+ escala linearmente com o número de VLANs (1 VLAN = 1 instância), o MSTP desacopla essa relação por meio de mapeamento, mantendo o consumo de CPU baixo e estável."
  },
  {
    question: "O que acontece com o tráfego de dados de uma VLAN específica que não foi explicitamente mapeada para nenhuma MSTI criada pelo administrador em uma região MST?",
    options: [
      "A VLAN é descartada automaticamente e perde conectividade.",
      "A VLAN é tratada obrigatoriamente pela MSTI 0 (IST - Internal Spanning Tree).",
      "A VLAN passa a rodar o protocolo PVST+ de forma isolada.",
      "A VLAN assume o papel de Master Port na borda da região."
    ],
    answer: "A VLAN é tratada obrigatoriamente pela MSTI 0 (IST - Internal Spanning Tree).",
    explanation: "Por padrão, todas as VLANs da rede pertencem inicialmente à MSTI 0 (IST) até que o administrador realize o mapeamento explícito delas para instâncias personalizadas (MSTI 1 a 4094)."
  }

      // 👉 Adicione mais questões aqui
    ];

    // Randomiza ordem das questões
    quizData.sort(() => Math.random() - 0.5);

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const totalTime = 10 * 60;
    
    // Armazena as respostas do usuário para revisão
    let userAnswers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const questionNumberEl = document.getElementById("question-number");
    const timerEl = document.getElementById("timer");
    const reviewEl = document.getElementById("review");

const SIMULADO_ID = "teste01";
const SIMULADO_TITULO = document.title || "Simulado";
let startTime = null;
let currentUserName = "";

// Helpers para salvar resultados no LocalStorage
function formatSeconds(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function saveResult(record) {
  try {
    const raw = localStorage.getItem("simulados");
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(record);
    localStorage.setItem("simulados", JSON.stringify(arr));
  } catch (e) { console.warn("Falha ao salvar resultado:", e); }
}


    function startQuiz() {
  const nameInput = document.getElementById("user-name");
  const nameVal = (nameInput?.value || "").trim();
  if (!nameVal) { alert("Por favor, informe seu nome antes de iniciar."); return; }
  currentUserName = nameVal;
  startTime = Date.now();
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
      startTimer();
    }

    function startTimer() {
      let timeLeft = totalTime;
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Tempo: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        if (timeLeft-- <= 0) {
          clearInterval(timer);
          showResults();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function showQuestion() {
      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `${currentQuestionIndex+1}/${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainer.innerHTML = '';

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      shuffled.forEach(opt => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.classList.add("quiz-option","w-full","text-left","p-4","border-2","rounded-lg","transition-colors","duration-200","hover:bg-blue-100","hover:border-blue-400");
        b.onclick = () => selectOption(b, opt);
        optionsContainer.appendChild(b);
      });

      nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Ver Resultados" : "Próxima Questão";
      nextBtn.disabled = true;

      updateProgressBar();
    }

    function selectOption(button, selected) {
      const q = quizData[currentQuestionIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach(b => b.disabled = true);

      // Armazena a resposta do usuário para a revisão
      userAnswers[currentQuestionIndex] = selected;

      if (selected === q.answer) {
        button.classList.add("bg-green-200","border-green-600");
        score++;
      } else {
        button.classList.add("bg-red-200","border-red-600");
        buttons.forEach(b => {
          if (b.textContent === q.answer) b.classList.add("bg-green-200","border-green-600");
        });
      }

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
  const endTime = Date.now();
  const timeSpentSeconds = startTime ? Math.round((endTime - startTime) / 1000) : 0;
  const resultRecord = {
    id: String(Date.now()),
    simuladoId: SIMULADO_ID,
    simuladoTitle: SIMULADO_TITULO,
    name: currentUserName,
    score: score,
    total: quizData.length,
    percent: quizData.length ? (score / quizData.length) * 100 : 0,
    timeSeconds: timeSpentSeconds,
    timeFormatted: formatSeconds(timeSpentSeconds),
    date: new Date().toISOString()
  };
  saveResult(resultRecord);
      clearInterval(timer);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const pct = quizData.length ? Math.round((score/quizData.length)*100) : 0;
scoreEl.textContent = `Você acertou ${score} de ${quizData.length} questões (${pct}%). Tempo: ${formatSeconds(timeSpentSeconds)}.`;

      reviewEl.innerHTML = quizData.map((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        const resultClass = isCorrect ? "bg-green-100 border-green-600" : "bg-red-100 border-red-600";
        return `
          <div class="p-4 border rounded-lg ${resultClass}">
            <p class="font-semibold">Q${i+1}: ${q.question}</p>
            <p class="text-sm">Sua resposta: <span class="font-semibold">${userAnswers[i] || 'Não respondida'}</span></p>
            <p class="text-sm">Resposta correta: <span class="font-semibold">${q.answer}</span></p>
            <p class="text-slate-600 text-sm mt-1">${q.explanation}</p>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
